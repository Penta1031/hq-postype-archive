name: Postype Sync

on:
  schedule:
    # GitHub cron uses UTC. 19:00 UTC is 04:00 KST the next day.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      post_url:
        description: "확인할 포스타입 글 링크 (비우면 전체 소스 확인)"
        required: false
        type: string
      ai_backfill:
        description: "기존 미공개 글도 AI 분류"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: postype-sync
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: crawler

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run check

      - run: npm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTYPE_AUTH_STATE: ${{ secrets.POSTYPE_AUTH_STATE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ADMIN_PAGE_URL: ${{ vars.ADMIN_PAGE_URL }}
          POSTYPE_SOURCE_URLS: ${{ vars.POSTYPE_SOURCE_URLS }}
          MANUAL_POST_URL: ${{ inputs.post_url || '' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER || '' }}
          AI_REVIEW_CONFIDENCE_THRESHOLD: ${{ vars.AI_REVIEW_CONFIDENCE_THRESHOLD || '0.72' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          GEMINI_MAX_ATTEMPTS: ${{ vars.GEMINI_MAX_ATTEMPTS || '2' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          AI_BACKFILL_UNREVIEWED: ${{ inputs.ai_backfill || 'false' }}
          AI_BACKFILL_LIMIT: ${{ vars.AI_BACKFILL_LIMIT || '5000' }}
          AI_BACKFILL_DELAY_MS: ${{ vars.AI_BACKFILL_DELAY_MS || '800' }}
          RETRY_FAILED_AI: ${{ vars.RETRY_FAILED_AI || 'true' }}
